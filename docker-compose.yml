volumes:
    prometheus_data: {}
    grafana_data: {}
    indi_fifo: {}

services:
  twinkle:
    image: twinkle
    tty: true
    build:
      context: .
      target: dev
    volumes:
      - .:/app
      - ./.storage/:/storage
      - indi_fifo:/indi/

    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - indi
    ports:
      - "8080:8080"
      - "4000:4000"

  indi:
    image: ghcr.io/twinkle-astronomy/indi_server:v2.1.1-202412060709
    command: bash -c "mkfifo /indi/control.fifo;indiserver -vv -f /indi/control.fifo indi_simulator_ccd indi_simulator_focus indi_simulator_guide indi_simulator_rotator indi_simulator_telescope indi_simulator_wheel indi_simulator_lightpanel"
    ports:
      - "7624:7624"
    volumes:
      - indi_fifo:/indi/
  prometheus:
    image: "prom/prometheus"
    command:
      - "--config.file=/etc/prometheus.yml"
      - "--enable-feature=exemplar-storage"
      - "--web.enable-remote-write-receiver"
    volumes:
      - "./prometheus/prometheus.yml:/etc/prometheus.yml"
  tempo:
    image: "grafana/tempo"
    command:
      - "-config.file=/etc/tempo.yaml"
    volumes:
      - "./prometheus/tempo.yaml:/etc/tempo.yaml"
    ports:
      - "127.0.0.1:3200:3200"    # Tempo
      - "4317:4317"    # OTLP GRPC (exposed for twinkle service)
      - "127.0.0.1:14268:14268"  # Jaeger
  grafana:
    image: "grafana/grafana"
    volumes:
      - "./prometheus/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml"
    environment:
      - "GF_AUTH_ANONYMOUS_ENABLED=true"
      - "GF_AUTH_ANONYMOUS_ORG_ROLE=Admin"
      - "GF_AUTH_DISABLE_LOGIN_FORM=true"
      - "GF_FEATURE_TOGGLES_ENABLE=traceqlEditor"
    ports:
      - "127.0.0.1:3000:3000"